<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LayerForge - 6层结构化AI生图</title>
    <link rel="manifest" href="/static/manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            text-align: center;
            padding: 20px;
        }
        .result img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .error.show {
            display: block;
        }
        .prompt-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 LayerForge</h1>
            <p>6 层结构化 AI 生图</p>
            <p>主体 / 场景 / 风格 / 光影 / 视角 / 画质</p>
        </div>

        <div class="card">
            <div class="error" id="error"></div>
            
            <div class="form-group">
                <label for="preset">选择预设风格：</label>
                <select id="preset">
                    <option value="">加载中...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="engine">选择引擎：</label>
                <select id="engine">
                    <option value="agnes">Agnes AI（推荐）</option>
                    <option value="pollinations">Pollinations（免费）</option>
                    <option value="huggingface">HuggingFace</option>
                    <option value="freeapi">Free API</option>
                </select>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="appraise" checked>
                    启用 AI 鉴赏
                </label>
            </div>

            <button class="btn" id="generateBtn" onclick="generate()">
                🚀 开始生成
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在生成图片，请稍候...</p>
                <p style="color: #999; font-size: 14px;">通常需要 10-30 秒</p>
            </div>

            <div class="result" id="result" style="display: none;">
                <img id="resultImage" src="" alt="生成的图片">
                <div class="prompt-info" id="promptInfo"></div>
            </div>
        </div>
    </div>

    <script>
        // 加载预设列表
        async function loadPresets() {
            try {
                const response = await fetch('/api/presets');
                const presets = await response.json();
                const select = document.getElementById('preset');
                select.innerHTML = '';
                
                if (presets.length === 0) {
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = '暂无可用预设';
                    select.appendChild(option);
                } else {
                    presets.forEach(preset => {
                        const option = document.createElement('option');
                        option.value = preset;
                        option.textContent = preset;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载预设失败:', error);
                showError('加载预设列表失败：' + error.message);
            }
        }

        // 生成图片
        async function generate() {
            const preset = document.getElementById('preset').value;
            const engine = document.getElementById('engine').value;
            const appraise = document.getElementById('appraise').checked;
            
            if (!preset) {
                showError('请选择一个预设风格');
                return;
            }

            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const error = document.getElementById('error');

            // 重置状态
            error.classList.remove('show');
            result.style.display = 'none';
            btn.disabled = true;
            btn.textContent = '生成中...';
            loading.classList.add('show');

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        preset: preset,
                        engine: engine,
                        appraise: appraise
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || '生成失败');
                }

                // 显示结果
                document.getElementById('resultImage').src = data.image;
                document.getElementById('promptInfo').innerHTML = `
                    <strong>提示词：</strong><br>
                    ${data.prompt}<br><br>
                    ${data.caption ? '<strong>AI 鉴赏：</strong><br>' + data.caption : ''}
                `;
                result.style.display = 'block';

            } catch (error) {
                console.error('生成失败:', error);
                showError('生成失败：' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 开始生成';
                loading.classList.remove('show');
            }
        }

        // 显示错误信息
        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = '❌ ' + message;
            error.classList.add('show');
            setTimeout(() => {
                error.classList.remove('show');
            }, 5000);
        }

        // 页面加载时加载预设
        window.onload = loadPresets;

        // 注册 Service Worker（PWA 功能）
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js')
                .then(reg => console.log('Service Worker 注册成功'))
                .catch(err => console.log('Service Worker 注册失败:', err));
        }
    </script>
</body>
</html>
